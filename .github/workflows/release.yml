name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # necesario para crear el Release y subir assets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # hatch-vcs necesita el historial completo de tags

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7

      - name: Build (wheel + sdist)
        run: uv build

      - name: Verificar que la versión del tag coincide con el paquete
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_VERSION=$(echo "$TAG_VERSION" | sed -E 's/-//g; s/([a-z])\./\1/g')
          BUILT_VERSION=$(unzip -p dist/*.whl '*/METADATA' | sed -n 's/^Version: //p' | head -1)
          echo "Tag: $TAG_VERSION / Build: $BUILT_VERSION"
          if [ "$TAG_VERSION" != "$BUILT_VERSION" ]; then
            echo "::error::El tag ($TAG_VERSION) no coincide con la versión del paquete ($BUILT_VERSION)"
            exit 1
          fi

      - name: Validar artefactos (twine check)
        run: uvx twine check dist/*

      - name: Correr tests antes de publicar
        run: uv run pytest

      - name: Subir artifacts al workflow (debug/trazabilidad)
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Crear GitHub Release con los paquetes
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
