site_name: BCRA-SDK
site_description: SDK no oficial para las APIs públicas del BCRA
repo_url: https://github.com/fernandezgonzalo/bcra-sdk
edit_uri: tree/main/docs

theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_symbol_type_heading: true
            show_source: false
            show_signature_annotations: true
            members_order: source

nav:
  - Inicio: index.md
  - Instalación: instalacion.md
  - Guía rápida: guia-rapida.md
  - Endpoints:
      - Deudores: endpoints/deudores.md
      - Cheques: endpoints/cheques.md
      - Estadísticas cambiarias: endpoints/estadisticas-cambiarias.md
      - Estadísticas monetarias: endpoints/monetarias.md
  - API Reference:
      - Cliente y configuración: api/cliente.md
      - Recursos: api/recursos.md
      - Modelos: api/modelos.md
      - Errores: api/errores.md
  - Versionado de endpoints: versionado.md
  - Reintentos: retry.md
  - Errores: errores.md
  - Logging: logging.md
  - Testing (cassettes e integración): testing.md
  - Contribución: contribucion.md
  - Changelog: changelog.md
