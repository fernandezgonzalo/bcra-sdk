repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.75
    hooks:
      - id: ty
  - repo: local
    hooks:
      - id: coverage
        name: coverage
        description: falla si la cobertura es menor a 100%
        entry: uv run pytest --cov=bcra_sdk --cov-fail-under=100
        language: system
        pass_filenames: false
        always_run: true
