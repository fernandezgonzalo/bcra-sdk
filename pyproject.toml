[project]
name = "bcra-sdk"
dynamic = ["version"]
description = "SDK no oficial para las APIs del BCRA"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Gonzadev", email = "fernandezgonzalosebastian@gmail.com" },
]
keywords = [
    "bcra",
    "banco central",
    "argentina",
    "api",
    "sdk",
    "deudores",
    "cheques",
    "cotizaciones",
    "divisas",
    "estadisticas",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.28.1",
]

[project.urls]
Homepage = "https://github.com/fernandezgonzalo/bcra-sdk"
Documentation = "https://bcra-sdk.readthedocs.io/"
Source = "https://github.com/fernandezgonzalo/bcra-sdk"
Changelog = "https://github.com/fernandezgonzalo/bcra-sdk/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/bcra_sdk"]

[dependency-groups]
dev = [
    "ipython>=9.15.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "tox>=4.44",
    "tox-uv>=1.33",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.4",
]

[tool.ruff]
include = ["*.py", "*.pyi"]

[tool.pytest.ini_options]
addopts = "--cov=bcra_sdk --cov-report=term-missing -m 'not integration'"
testpaths = ["tests"]
markers = [
    "integration: tests en vivo contra la API del BCRA (requieren red). Correr con: uv run pytest -m integration --no-cov",
]
filterwarnings = [
    "ignore:Module bcra_sdk was previously imported:coverage.misc.CoverageWarning",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.tox]
legacy_tox_ini = """
[tox]
env_list = py311, py312, py313, py314, py315
requires =
    tox>=4.44
    tox-uv>=1.33

[testenv]
description = correr los tests con pytest y coverage
package = editable
deps =
    pytest
    pytest-cov
commands =
    pytest {posargs}
"""
